name: Schnee erfassen & Seite veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    # UTC: 08:30 / 13:30 = 09:30 / 14:30 Wiener Winterzeit,
    # kurz nach den LiftRadar-Updates (ca. 08:40 und 13:40)
    - cron: "30 8 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write # Snapshot committen
  pages: write # Seite veröffentlichen
  id-token: write

concurrency:
  group: snow-pages
  cancel-in-progress: false

jobs:
  record:
    # Bei normalen Code-Pushes nichts erfassen, nur veröffentlichen
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Snapshot speichern
        run: python scripts/record_snow.py

      # Neue/entfernte Kameras übernehmen; ein Fehler hier darf die Erfassung nicht blockieren
      - name: Webcam-Zuordnung aktualisieren
        continue-on-error: true
        run: python scripts/build_webcams.py

      - name: Snapshot committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/webcams.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
            exit 0
          fi
          git commit -m "Schnee-Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

  deploy:
    needs: record
    # Läuft nach der Erfassung und bei jedem Push (dann ist "record" übersprungen)
    if: ${{ !cancelled() && needs.record.result != 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # inklusive des gerade committeten Snapshots

      - uses: actions/configure-pages@v6

      # Versionsnummer an JS/CSS hängen: GitHub Pages cacht 10 Minuten, so passen
      # index.html und Skripte nach einem Update immer zusammen
      - name: Cache-Busting
        run: |
          v=$(git rev-parse --short HEAD)
          sed -i -E "s/(href=\"styles\.css|src=\"app\.js)\"/\1?v=$v\"/" index.html
          grep -E "styles\.css|app\.js" index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
